syntax = "proto2";

package third_party.lisp.cl_protobufs.tests;

// Only the shim is imported: Detail and Code are visible through its
// `import public` but defined in import-public-target.proto.
import "import-public-shim.proto"; // Test proto

message ImportPublicConsumer {
  optional import_public_target.Detail detail = 1;
  optional import_public_target.Code code = 2;
}
