syntax = "proto2";

package third_party.lisp.cl_protobufs.tests.import_public_middle;

// Intermediate `import public` shim in its own package, compiled in the same
// `proto_library` as import-public-target.proto and re-exported again by
// import-public-shim.proto to exercise both same-target compile-time re-export
// and multi-hop transitive `import public`.
import public "import-public-target.proto"; // Test proto
